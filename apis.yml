aid: k2-space
name: K2 Space
description: 'K2 Space (K2 Space Corporation) is a Los Angeles / Torrance, California
  aerospace startup that designs and manufactures high-power "Mega Class" satellite
  buses. Its platforms deliver roughly 20kW of array power and up to one metric ton
  of payload capacity - about ten times the power and payload of conventional buses
  - to maximize the throw-weight of next-generation launch vehicles like SpaceX Starship
  and Blue Origin New Glenn. K2 builds radiation-tolerant, vertically integrated (80%
  in-house) spacecraft with redundant avionics and high-delta-v propulsion for LEO,
  MEO, GEO and cislunar missions, serving commercial and U.S. government / defense
  customers. Backed by First Round Capital, Lightspeed Venture Partners and Redpoint
  Ventures, the company raised a $250M Series C at a $3B valuation and is preparing
  its first production satellite, GRAVITAS. K2 Space is a hardware company with no
  public developer API; this profile tracks its identity and web presence in the API
  Evangelist network.'
